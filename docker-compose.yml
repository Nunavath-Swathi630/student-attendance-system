services:
  mongodb:
    image: mongo:8
    container_name: attendance-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: attendance-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/attendanceDB
      PORT: 5000
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
    container_name: attendance-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongodb_data: